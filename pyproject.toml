[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dei-rag"
version = "0.1.0"
description = "Ingestion pipeline for Doofenshmirtz Evil Incorporated policy documents."
requires-python = ">=3.11"
dependencies = [
  "llama-index-core>=0.12.0",
  "llama-index-readers-file>=0.4.0",
  "llama-index-vector-stores-chroma>=0.4.0",
  "chromadb>=0.6.0",
  "pypdf>=5.0.0",
  "docx2txt>=0.8",
  "httpx>=0.27.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.13.0",
  "build>=1.2.0",
]

[tool.setuptools]
py-modules = ["settings"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "retrieval: needs Chroma plus embeddings",
  "generation: needs Ollama generation",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "evaluation_harness"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
  "adapter",
  "evaluation_harness",
  "generation",
  "ingestion",
  "retrieval",
  "settings",
  "utility",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["src", "evaluation_harness", "tests"]
