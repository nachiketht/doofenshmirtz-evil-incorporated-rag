[project]
name = "doofenshmirtz-evil-incorporated-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb",
    "llama-index-core",
    "llama-index-readers-file",
    "docx2txt",
    "ollama",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rag --cov=adpater --cov-report=term-missing -m 'not ollama'"
markers = ["ollama: needs a running local Ollama daemon"]

[tool.coverage.run]
source = ["rag", "adpater"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
