[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dei-rag"
version = "0.1.0"
description = "Ingestion pipeline for Doofenshmirtz Evil Incorporated policy documents."
requires-python = ">=3.11"
dependencies = [
  "llama-index-core>=0.12.0",
  "llama-index-readers-file>=0.4.0",
  "llama-index-vector-stores-chroma>=0.4.0",
  "chromadb>=0.6.0",
  "pypdf>=5.0.0",
  "docx2txt>=0.8",
  "httpx>=0.27.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "build>=1.2.0",
]

[tool.setuptools]
py-modules = ["settings"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "retrieval: needs Chroma plus embeddings",
  "generation: needs Ollama generation",
]
