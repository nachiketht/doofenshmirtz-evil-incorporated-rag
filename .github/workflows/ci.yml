name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "ruff==0.16.10"

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Lint
        run: ruff check src tests scripts

  build:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install build

      - name: Build
        run: python -m build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests
        run: pytest

      - name: Offline evaluation (hashing embedder, no network)
        run: python scripts/run_eval.py --min-recall 0.8 --min-accuracy 0.65 --max-leaks 0

      - name: Check committed live evaluation
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          from eval_set import CASES
          data = json.loads(Path("results/result.json").read_text())
          totals = data["totals"]
          asked = {row["question"] for row in data["rows"]}
          missing = [c["question"] for c in CASES if c.get("access") != "restricted" and c["question"] not in asked]
          assert not missing, f"results/result.json is stale; rerun scripts/run_eval.py --live. missing={missing}"
          assert "leaks" in totals and totals["leaks"] == 0, totals
          assert totals["recall"] >= 0.9, totals
          assert totals["accuracy"] >= 0.8, totals
          print(f"live recall={totals['recall']:.3f} accuracy={totals['accuracy']:.3f} questions={len(data['rows'])}")
          PY
