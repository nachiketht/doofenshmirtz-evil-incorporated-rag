name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "ruff==0.16.10"

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Lint
        run: ruff check src tests scripts

  build:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install build

      - name: Build
        run: python -m build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests
        run: pytest

      - name: Offline evaluation (hashing embedder, no network)
        run: python scripts/run_eval.py --min-recall 0.8 --min-accuracy 0.65 --max-leaks 0

      - name: Check committed live evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("results/result.json").read_text())
          totals = data["totals"]
          assert totals.get("leaks", 0) == 0, totals
          assert totals["recall"] >= 0.9, totals
          assert len(data["rows"]) >= 8
          print(f"live recall={totals['recall']:.3f} accuracy={totals['accuracy']:.3f} questions={len(data['rows'])}")
          PY
