name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ruff

      - name: Format check
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install build

      - name: Build
        run: python -m build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests
        run: pytest

      - name: Evaluate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("results/result.json").read_text())
          totals = data["totals"]
          assert totals["recall"] == 1.0, totals
          assert totals["accuracy"] == 1.0, totals
          assert len(data["rows"]) >= 8
          print(f"recall={totals['recall']:.3f} accuracy={totals['accuracy']:.3f} questions={len(data['rows'])}")
          PY
